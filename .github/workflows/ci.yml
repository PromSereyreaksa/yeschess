name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine fuzz test
        run: npm test
      - name: Server smoke test (anti-cheat)
        run: |
          npm start &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/health && break; sleep 0.5; done
          npm run test:server
          npm run test:lobby
